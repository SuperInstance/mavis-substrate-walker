name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installing the package validates the pyproject build; the suite
      # itself is stdlib-only (run_tests.py puts src/ on sys.path).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Test
        run: python run_tests.py
